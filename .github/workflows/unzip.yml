name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          F=$(ls DisciplineGuard_v*.zip | grep -v cleaner | sort -V | tail -1)
          C=$(ls DisciplineGuard_v*cleaner*.zip | sort -V | tail -1)
          unzip -q -o "$F" -d FocusGuard
          unzip -q -o "$C" -d GuardCleaner
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract projects" || echo "nothing to commit"
          git push
