name: Build APKs
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zips
        run: |
          F=$(ls DisciplineGuard_v*.zip 2>/dev/null | grep -v cleaner | sort -V | tail -1 || true)
          C=$(ls DisciplineGuard_v*cleaner*.zip 2>/dev/null | sort -V | tail -1 || true)
          rm -rf _focus _clean
          if [ -n "$F" ]; then unzip -q -o "$F" -d _focus; fi
          if [ -n "$C" ]; then unzip -q -o "$C" -d _clean; fi
          echo "Focus zip: $F"
          echo "Cleaner zip: $C"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build Guard Cleaner
        continue-on-error: true
        run: |
          P=$(find _clean -name settings.gradle.kts 2>/dev/null | head -1)
          if [ -z "$P" ]; then echo "no cleaner project"; exit 0; fi
          cd "$(dirname "$P")"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Build Focus Guard
        continue-on-error: true
        run: |
          P=$(find _focus -name settings.gradle.kts 2>/dev/null | head -1)
          if [ -z "$P" ]; then echo "no focus project"; exit 0; fi
          cd "$(dirname "$P")"
          gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: GuardCleaner-apk
          path: _clean/**/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-apk
          path: _focus/**/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
