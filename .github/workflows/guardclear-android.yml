name: GuardClear Android Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'GuardClear/**'
      - '.github/workflows/guardclear-android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p GuardClear assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GuardClear-debug-apk
          path: GuardClear/app/build/outputs/apk/debug/app-debug.apk
