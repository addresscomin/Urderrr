name: ReelForge ZIP Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/zm-clip-ai
    paths:
      - "reelforge-updated.zip"
      - ".github/workflows/reelforge-zip-check.yml"

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded ReelForge archive
        run: |
          test -s reelforge-updated.zip
          unzip -Z1 reelforge-updated.zip
          mkdir -p /tmp/reelforge-src
          unzip -q reelforge-updated.zip -d /tmp/reelforge-src
          echo "=== PROJECT README ==="
          cat /tmp/reelforge-src/reelforge/README.md
          echo "=== REQUIREMENTS ==="
          cat /tmp/reelforge-src/reelforge/requirements.txt
          echo "=== DOCKERFILE ==="
          cat /tmp/reelforge-src/reelforge/Dockerfile
          echo "=== API ENTRYPOINT ==="
          sed -n '1,260p' /tmp/reelforge-src/reelforge/app/main.py
          echo "=== APP CONFIG ==="
          sed -n '1,220p' /tmp/reelforge-src/reelforge/app/config.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python source
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          root = pathlib.Path("/tmp/reelforge-src/reelforge")
          files = list(root.rglob("*.py"))
          print(f"Python files found: {len(files)}")
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((path, exc))
          for path, exc in failures:
              print(f"COMPILE ERROR: {path}: {exc}")
          if failures:
              sys.exit(1)
          print("Python syntax check passed.")
          PY

      - name: Install dependencies and run tests
        working-directory: /tmp/reelforge-src/reelforge
        env:
          PYTHONPATH: /tmp/reelforge-src/reelforge
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          python -m pytest -q

      - name: Smoke-test FastAPI application
        working-directory: /tmp/reelforge-src/reelforge
        env:
          PYTHONPATH: /tmp/reelforge-src/reelforge
          DATA_DIR: /tmp/reelforge-smoke-data
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import app

          paths = sorted({route.path for route in app.routes if hasattr(route, "path")})
          print("Registered API routes:")
          for path in paths:
              print(path)

          with TestClient(app) as client:
              response = client.get("/openapi.json")
              assert response.status_code == 200, f"OpenAPI returned {response.status_code}"
              schema = response.json()
              assert "paths" in schema, "OpenAPI schema has no paths"
              print(f"OpenAPI OK; {len(schema['paths'])} API paths registered")

              if "/" in paths:
                  page = client.get("/")
                  assert page.status_code < 500, f"Homepage returned {page.status_code}"
                  print(f"Homepage response: {page.status_code}")
          PY

      - name: Verify web entrypoint
        run: |
          test -s /tmp/reelforge-src/reelforge/web/index.html
          test -s /tmp/reelforge-src/reelforge/web/manifest.json
          echo "ReelForge frontend entrypoint checks passed."
