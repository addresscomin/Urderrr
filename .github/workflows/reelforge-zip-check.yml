name: ReelForge ZIP Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/zm-clip-ai
    paths:
      - "reelforge-updated.zip"
      - ".github/workflows/reelforge-zip-check.yml"

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and inspect uploaded archive
        run: |
          test -s reelforge-updated.zip
          echo "=== ZIP CONTENTS ==="
          unzip -Z1 reelforge-updated.zip
          mkdir -p /tmp/reelforge-src
          unzip -q reelforge-updated.zip -d /tmp/reelforge-src
          echo "=== TOP LEVEL ==="
          find /tmp/reelforge-src -maxdepth 3 -type f | sort

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python source
        run: |
          python - <<'PY'
          import pathlib, py_compile, sys
          root = pathlib.Path("/tmp/reelforge-src")
          files = list(root.rglob("*.py"))
          print(f"Python files found: {len(files)}")
          failures = []
          for path in files:
              try:
                  py_compile.compile(str(path), doraise=True)
              except Exception as exc:
                  failures.append((path, exc))
          for path, exc in failures:
              print(f"COMPILE ERROR: {path}: {exc}")
          if failures:
              sys.exit(1)
          print("Python syntax check passed.")
          PY

      - name: Validate web entrypoint and dependencies
        run: |
          ROOT="$(find /tmp/reelforge-src -type f \( -name index.html -o -name requirements.txt \) -printf '%h\n' | sort -u)"
          echo "Detected web/dependency directories:"
          printf '%s\n' "$ROOT"
          find /tmp/reelforge-src -maxdepth 4 -type f \( -name index.html -o -name requirements.txt -o -name Dockerfile -o -name pyproject.toml \) -print
          test -n "$(find /tmp/reelforge-src -type f -name index.html -print -quit)"
          echo "ReelForge archive extraction and entrypoint check passed."
