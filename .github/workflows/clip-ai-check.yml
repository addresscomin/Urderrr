name: Clip AI checks
on:
  push:
    paths:
      - 'clip-ai/**'
      - '.github/workflows/clip-ai-check.yml'
  pull_request:
    paths:
      - 'clip-ai/**'
      - '.github/workflows/clip-ai-check.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd clip-ai/frontend && npm install && npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile clip-ai/backend/app.py clip-ai/backend/worker.py
      - name: Check SQL security invariants
        run: |
          ! grep -Eiq 'security definer|auth\.role\(' clip-ai/supabase/schema.sql
          grep -Eiq 'enable row level security' clip-ai/supabase/schema.sql
          grep -Eiq 'grant execute .* to service_role' clip-ai/supabase/schema.sql
