services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
  api:
    build: ./backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - clip_data:/data
    depends_on:
      - redis
    restart: unless-stopped
  worker:
    build: ./backend
    command: rq worker --url ${REDIS_URL:-redis://redis:6379/0} clips
    env_file: .env
    volumes:
      - clip_data:/data
    depends_on:
      - redis
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  clip_data:
  redis_data: