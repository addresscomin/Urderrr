services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: ./backend
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - clip_data:/data
    depends_on:
      - redis
    restart: unless-stopped
  worker:
    build: ./backend
    command: rq worker --url ${REDIS_URL:-redis://redis:6379/0} clips
    env_file: .env
    volumes:
      - clip_data:/data
    depends_on:
      - redis
    restart: unless-stopped
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    depends_on:
      - api
volumes:
  clip_data:
