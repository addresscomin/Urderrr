name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find project (extracts a zip in the repo if needed)
        run: |
          Z=$(ls DisciplineGuard_v*.zip 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$Z" ]; then
            rm -rf _src
            unzip -q -o "$Z" -d _src
          fi
          F=$(find . -name settings.gradle.kts -not -path "./.git/*" | sort | tail -1)
          if [ -z "$F" ]; then echo "settings.gradle.kts not found"; ls -R | head -50; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$F")" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: DisciplineGuard-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
